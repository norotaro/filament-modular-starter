[program:worker-scheduler]
process_name=%(program_name)s_%(process_num)02d
user=www-data
group=www-data
; The while-loop replaces schedule:work on purpose: ScheduleWorkCommand polls
; every 100 ms, which keeps a CPU busy for no benefit;
; one schedule:run per minute is all Laravel needs.
command=bash -c 'while true; do php /app/artisan schedule:run; sleep 60; done'
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
