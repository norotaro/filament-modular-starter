[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
user=www-data
group=www-data
; stopwaitsecs=3600 lets in-flight jobs finish before shutdown;
; --max-time=3600 restarts the worker hourly to bound memory growth.
command=bash -c 'exec php /app/artisan queue:work --sleep=30 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
