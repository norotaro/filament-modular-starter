[program:worker-octane]
process_name=%(program_name)s_%(process_num)02d
user=www-data
group=www-data
; FrankenPHP's embedded Caddy binds the public port directly. Recycling each
; worker after 500 requests bounds memory growth. docker/Caddyfile carries the
; security rules.
command=bash -c 'exec php /app/artisan octane:frankenphp --host=0.0.0.0 --port=${PORT:-8000} --admin-port=2019 --workers=auto --max-requests=500 --caddyfile=/etc/app/Caddyfile'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
